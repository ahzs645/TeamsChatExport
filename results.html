<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teams Chat Exporter — Viewer</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="viewer">
  <header id="top-bar">
    <div class="top-bar-start">
      <button type="button" id="upload-button" class="btn">
        <svg class="btn-icon-svg" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M4.5 3a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-11Zm5.15 2.15a.5.5 0 0 1 .7 0l4.5 4.5a.5.5 0 0 1-.7.7L10.5 6.71V17.5a.5.5 0 0 1-1 0V6.7l-3.65 3.66a.5.5 0 1 1-.7-.71l4.5-4.5Z"/></svg>
        <span>Upload JSON</span>
      </button>
      <input type="file" id="file-upload" accept=".json,application/json" hidden>
    </div>

    <div class="search-container" role="search">
      <label for="global-search-input" class="visually-hidden">Search this chat</label>
      <svg class="search-icon" aria-hidden="true" width="16" height="16" viewBox="0 0 20 20" fill="currentColor"><path d="M8.5 3a5.5 5.5 0 0 1 4.23 9.02l4.12 4.13a.5.5 0 0 1-.63.76l-.07-.06-4.13-4.12A5.5 5.5 0 1 1 8.5 3Zm0 1a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg>
      <input type="search" id="global-search-input" placeholder="Search this chat" autocomplete="off" spellcheck="false" aria-describedby="search-count">
      <span id="search-count" class="search-count" aria-live="polite"></span>
      <button type="button" id="search-clear" class="icon-button" aria-label="Clear search" hidden>
        <svg aria-hidden="true" width="14" height="14" viewBox="0 0 20 20" fill="currentColor"><path d="m4.09 4.22.06-.07a.5.5 0 0 1 .63-.06l.07.06L10 9.29l5.15-5.14a.5.5 0 0 1 .63-.06l.07.06c.18.17.2.44.06.63l-.06.07L10.71 10l5.14 5.15c.18.17.2.44.06.63l-.06.07a.5.5 0 0 1-.63.06l-.07-.06L10 10.71l-5.15 5.14a.5.5 0 0 1-.63.06l-.07-.06a.5.5 0 0 1-.06-.63l.06-.07L9.29 10 4.15 4.85a.5.5 0 0 1-.06-.63l.06-.07-.06.07Z"/></svg>
      </button>
    </div>

    <div class="top-bar-end">
      <div class="menu">
        <button type="button" id="export-menu-button" class="btn btn-primary" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">
          <span>Export</span>
          <svg aria-hidden="true" width="12" height="12" viewBox="0 0 20 20" fill="currentColor"><path d="M15.85 7.65c.2.2.2.5 0 .7l-5.46 5.49a.55.55 0 0 1-.78 0L4.15 8.35a.5.5 0 1 1 .7-.7L10 12.8l5.15-5.16c.2-.2.5-.2.7 0Z"/></svg>
        </button>
        <ul id="export-menu" class="menu-list" role="menu" aria-labelledby="export-menu-button" hidden>
          <li role="none" class="menu-caption" aria-hidden="true">All conversations</li>
          <li role="none"><button type="button" role="menuitem" tabindex="-1" data-export="json">Download JSON</button></li>
          <li role="none"><button type="button" role="menuitem" tabindex="-1" data-export="csv">Download CSV</button></li>
          <li role="none"><button type="button" role="menuitem" tabindex="-1" data-export="txt">Download TXT</button></li>
          <li role="none"><button type="button" role="menuitem" tabindex="-1" data-export="html">Export HTML page</button></li>
        </ul>
      </div>
      <div class="menu">
        <button type="button" id="more-menu-button" class="btn btn-subtle btn-square" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 20 20" fill="currentColor"><path d="M6.25 10a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0Zm5 0a1.25 1.25 0 1 1-2.5 0 1.25 1.25 0 0 1 2.5 0ZM15 11.25a1.25 1.25 0 1 0 0-2.5 1.25 1.25 0 0 0 0 2.5Z"/></svg>
        </button>
        <ul id="more-menu" class="menu-list" role="menu" aria-labelledby="more-menu-button" hidden>
          <li role="none"><button type="button" role="menuitem" tabindex="-1" id="clear-data-button" class="danger">Clear all data…</button></li>
        </ul>
      </div>
    </div>
  </header>

  <div id="main-content">
    <nav id="sidebar" aria-labelledby="sidebar-heading">
      <h2 id="sidebar-heading">Conversations <span id="chat-count" class="count-badge"></span></h2>
      <ul id="chat-list" aria-labelledby="sidebar-heading"></ul>
      <p id="sidebar-hint" class="sidebar-hint">Use ↑ ↓ to move between chats, Enter to open, Delete to remove.</p>
    </nav>

    <main id="chat-area">
      <header id="chat-header" hidden>
        <div class="chat-header-row">
          <span id="chat-avatar" class="avatar avatar-md" aria-hidden="true"></span>
          <div class="chat-heading">
            <h1 id="chat-title" class="chat-title">Select a conversation</h1>
            <span id="chat-meta" class="chat-meta"></span>
          </div>
          <div class="you-control">
            <label for="current-user-select">You:</label>
            <select id="current-user-select">
              <option value="">Not set</option>
            </select>
          </div>
        </div>
        <div class="chat-header-row participants-row">
          <span id="participants-label" class="participants-label">Participants</span>
          <ul id="participants-list" class="participants-list" aria-labelledby="participants-label"></ul>
        </div>
      </header>
      <div id="message-list" role="region" aria-label="Messages" tabindex="0" hidden></div>
      <section id="empty-state" class="empty-state" hidden aria-labelledby="empty-title">
        <svg class="empty-illustration" aria-hidden="true" width="64" height="64" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 1 1-3.61 15.14l-.12-.07-3.65.96a.5.5 0 0 1-.62-.54l.01-.07.96-3.64-.06-.11A7.95 7.95 0 0 1 2 10.25V10a8 8 0 0 1 8-8Zm0 1a7 7 0 0 0-6.1 10.42.5.5 0 0 1 .06.28l-.02.1-.75 2.82 2.84-.74a.5.5 0 0 1 .29.01l.08.04A7 7 0 1 0 10 3Zm.5 8a.5.5 0 0 1 .09 1H7.5a.5.5 0 0 1-.09-1h3.09Zm2-3a.5.5 0 0 1 .09 1H7.5a.5.5 0 0 1-.09-1h5.09Z"/></svg>
        <h2 id="empty-title">No chats yet</h2>
        <p>Open a chat in Teams and click <strong>Extract This Chat</strong> in the extension popup, or upload a JSON export.</p>
        <button type="button" id="empty-upload-button" class="btn btn-primary">Upload JSON</button>
      </section>
    </main>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <dialog id="confirm-dialog" class="dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <h2 id="confirm-title" class="dialog-title"></h2>
      <p id="confirm-body" class="dialog-body"></p>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn" autofocus>Cancel</button>
        <button type="submit" value="confirm" id="confirm-ok" class="btn btn-danger"></button>
      </div>
    </form>
  </dialog>

  <script src="results.js"></script>
</body>
</html>
