name: Release

# Publishes a release named after manifest.json's version (e.g. v6.7), with a
# ready-to-load extension zip and notes from .github/release-notes/<tag>.md.
# Run it from the Actions tab ("Run workflow"), or push a matching v* tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out the tag
        run: |
          tag="v$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "manifest.json says $tag but the pushed tag is $GITHUB_REF_NAME"; exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build extension zip
        run: |
          zip -r "TeamsChatExport-$TAG.zip" . \
            -x '.git/*' '.github/*' 'scripts/*' 'node_modules/*' '*.zip' '.gitignore' '.DS_Store'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" "TeamsChatExport-$TAG.zip" \
            --title "Teams Chat Exporter $TAG" --target "$GITHUB_SHA" "$@"
